# Local model server for development and testing.
#
# Runs Ollama and pre-pulls a small instruct model, so the moderation and
# pre-flight passes (the two cheap LLM calls on the request path) can be
# exercised end-to-end with no cloud credentials and no token bill.
#
#   docker compose -f docker-compose.local.yml up -d      # start + pull the model
#   docker compose -f docker-compose.local.yml logs -f puller
#   curl localhost:11434/api/tags                          # ready when the model is listed
#
# Then point the cheap alias at it (see docs/local-llm.md):
#   LLM_PROVIDER_FLASH=ollama LLM_MODEL_FLASH=qwen2.5:3b npm run dev:api
#
# NOT for production: a 3B local model is much weaker than the hosted ones. That
# is the point — if the guards hold with a sloppy model, they hold.
services:
  ollama:
    image: ollama/ollama:latest
    container_name: agent-researcher-ollama
    ports:
      - '11434:11434'
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ['CMD-SHELL', 'ollama list >/dev/null 2>&1 || exit 1']
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: pulls the models the local setup expects, then exits.
  puller:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      # qwen2.5 supports both constrained JSON output and tool calling, which is
      # what the moderation/pre-flight calls and the research loop need.
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ['/bin/sh', '-c']
    command: >
      "ollama pull qwen2.5:3b && echo 'local models ready'"
    restart: 'no'

volumes:
  ollama-models:
