# Build + deploy the public FloridaBizLab SPA (apps/fbizlab) to Firebase Hosting on push to main.
#
# Static site, no server. Auth reuses the dev service-account key (GCP_SA_KEY_DEV,
# roles/owner) — google-github-actions/auth exports GOOGLE_APPLICATION_CREDENTIALS,
# which firebase-tools uses to deploy Hosting.
#
# Every key/id/URL differs between dev and prod, so build-time config is namespaced
# per environment: this dev workflow reads FBIZLAB_DEV_*; the prod workflow
# (deploy-fbizlab-prod.yml) reads FBIZLAB_PROD_*. Never share a value across envs.
#
# ONE-TIME SETUP (dev):
#   # create the Hosting site (owner account, miltonjaviera@gmail.com):
#   firebase hosting:sites:create agent-researcher-dev-fbizlab --project sinuous-canto-497518-h7
#   # build-time config as repo VARIABLES (all public, not secrets):
#   gh variable set FBIZLAB_DEV_API_BASE_URL --body "https://agent-researcher-dev-api-xxxxx.run.app"
#   gh variable set FBIZLAB_DEV_GOOGLE_CLIENT_ID --body "1234-abc.apps.googleusercontent.com"
#
#
# The pricing catalog is baked into the build (scripts/fetch-plans.mjs), so the
# landing never calls the API or Stripe for it. That means a Stripe price change
# only reaches visitors on the next build — hence the daily schedule below, plus
# workflow_dispatch for "publish it now".
#
name: Deploy fbizlab SPA (dev)

on:
  push:
    branches: [main]
    paths:
      # Its own code…
      - 'apps/fbizlab/**'
      # …and the backend, because the build bakes the Stripe catalog into the
      # bundle: a backend release is a good moment to refresh prices, and it costs
      # ~40s. Everything else (worker, admin, infra, docs) skips this workflow, so
      # the common push stays fast.
      - 'apps/api/**'
      - 'packages/core/**'
      - '.github/workflows/deploy-fbizlab.yml'
  # Daily regardless: Stripe can change with no push at all, and that is the case
  # the schedule exists for.
  schedule:
    - cron: '20 6 * * *'
  workflow_dispatch: {}

concurrency:
  group: deploy-fbizlab-dev
  cancel-in-progress: true

permissions:
  contents: read

env:
  GCP_PROJECT_ID: sinuous-canto-497518-h7

jobs:
  # Nothing deploys that has not passed the suite. Six workflows shipped straight
  # from `setup-gcloud` to `deploy.sh`, so every guard in the repo was advisory.
  verify:
    uses: ./.github/workflows/verify.yml

  deploy-fbizlab:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build fbizlab SPA
        env:
          VITE_API_BASE_URL: ${{ vars.FBIZLAB_DEV_API_BASE_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.FBIZLAB_DEV_GOOGLE_CLIENT_ID }}
          VITE_APP_ID: fbizlab
          # Public site key, per environment — no fallback on purpose: a build with no
          # key ships a site nobody can sign in to, and `vite.config.ts` refuses it.
          VITE_TURNSTILE_SITE_KEY: ${{ vars.FBIZLAB_DEV_TURNSTILE_SITE_KEY }}
          # Dev serves a byte-identical copy of the marketing site on a public URL.
          # `SEO_INDEXABLE` false makes the generated robots.txt `Disallow: /` and the
          # sitemap empty, so a staging copy stops competing with production for the
          # same queries. `SITE_URL` is dev's OWN origin — never prod's, or dev would
          # canonicalize itself onto the live site.
          SITE_URL: ${{ vars.FBIZLAB_DEV_SITE_URL }}
          SEO_INDEXABLE: 'false'
        run: npm run build -w @agent-researcher/fbizlab

      - name: Authenticate to Google Cloud (service-account key)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          credentials_json: ${{ secrets.GCP_SA_KEY_DEV }}

      - name: Deploy to Firebase Hosting (dev site)
        working-directory: apps/fbizlab
        run: npx --yes firebase-tools deploy --only hosting:fbizlab-dev --project "${GCP_PROJECT_ID}" --non-interactive
