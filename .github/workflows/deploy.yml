# Deploys agent-researcher PROD to Cloud Run (push to deploy-prod).
# DEV (push to main) is handled by deploy-dev.yml, which also creates resources.
#   push to deploy-prod  -> prod (agent-researcher-prod-*)
#
# NOTE: this workflow only DEPLOYS; run `ENV=prod bash infra/setup-gcp.sh` once
# to provision prod resources (deploy-dev.yml runs setup automatically for dev).
#
# Required GitHub secrets (per environment, suffixed _DEV / _PROD):
#   WIF_PROVIDER_DEV / WIF_PROVIDER_PROD
#       Workload Identity Federation provider resource, e.g.
#       projects/NUMBER/locations/global/workloadIdentityPools/POOL/providers/PROVIDER
#   DEPLOY_SA_DEV / DEPLOY_SA_PROD
#       Deploy service account email the pipeline impersonates. It needs:
#       roles/run.admin, roles/cloudbuild.builds.editor,
#       roles/artifactregistry.writer, roles/iam.serviceAccountUser
#       (to act as the runtime SAs), roles/storage.admin (Cloud Build staging).
#   TAVILY_API_KEY_DEV / TAVILY_API_KEY_PROD   (optional web-search key)
#   STRIPE_SECRET_KEY_*, STRIPE_WEBHOOK_SECRET_*, AUTH_JWT_SECRET_*,
#   POSTMARK_SERVER_TOKEN_*, TURNSTILE_SECRET_*, BRAVE_API_KEY_*
#       Every one of these must exist for the env being deployed. `--set-env-vars`
#       REPLACES the service environment, so a secret this workflow does not pass is
#       ERASED from the running service — `deploy.sh` refuses a prod deploy without
#       the two that take the site down (auth, Stripe webhook).
#
# One-time infra per env (run locally by an owner, not in CI):
#   ENV=dev  bash infra/setup-gcp.sh
#   ENV=prod bash infra/setup-gcp.sh
name: Deploy

on:
  push:
    branches: [deploy-prod]

permissions:
  contents: read
  id-token: write # required for Workload Identity Federation

jobs:
  # Nothing deploys that has not passed the suite. Six workflows shipped straight
  # from `setup-gcloud` to `deploy.sh`, so every guard in the repo was advisory.
  verify:
    uses: ./.github/workflows/verify.yml

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve environment from branch
        id: env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/deploy-prod" ]; then
            echo "name=prod" >> "$GITHUB_OUTPUT"
          else
            echo "name=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          project_id: sinuous-canto-497518-h7
          workload_identity_provider: ${{ github.ref == 'refs/heads/deploy-prod' && secrets.WIF_PROVIDER_PROD || secrets.WIF_PROVIDER_DEV }}
          service_account: ${{ github.ref == 'refs/heads/deploy-prod' && secrets.DEPLOY_SA_PROD || secrets.DEPLOY_SA_DEV }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Build & deploy
        # EVERY secret `deploy.sh` reads, because `--set-env-vars` REPLACES the
        # service's environment rather than merging into it: a name missing here is
        # not "left as it was", it is deleted from the running service. This block
        # used to carry three of them, so the first prod release would have shipped
        # `AUTH_JWT_SECRET=""` (the API throws on every sign AND every verify — no
        # login, every live session dead), both Stripe keys empty (checkout 503, and
        # a webhook that cannot verify a signature: money in, no credits out) and no
        # Postmark. `deploy-dev.yml` has always passed the full set (round 8, R8-1).
        env:
          ENV: ${{ steps.env.outputs.name }}
          TAVILY_API_KEY: ${{ github.ref == 'refs/heads/deploy-prod' && secrets.TAVILY_API_KEY_PROD || secrets.TAVILY_API_KEY_DEV }}
          TURNSTILE_SECRET: ${{ github.ref == 'refs/heads/deploy-prod' && secrets.TURNSTILE_SECRET_PROD || secrets.TURNSTILE_SECRET_DEV }}
          STRIPE_SECRET_KEY: ${{ github.ref == 'refs/heads/deploy-prod' && secrets.STRIPE_SECRET_KEY_PROD || secrets.STRIPE_SECRET_KEY_DEV }}
          STRIPE_WEBHOOK_SECRET: ${{ github.ref == 'refs/heads/deploy-prod' && secrets.STRIPE_WEBHOOK_SECRET_PROD || secrets.STRIPE_WEBHOOK_SECRET_DEV }}
          AUTH_JWT_SECRET: ${{ github.ref == 'refs/heads/deploy-prod' && secrets.AUTH_JWT_SECRET_PROD || secrets.AUTH_JWT_SECRET_DEV }}
          POSTMARK_SERVER_TOKEN: ${{ github.ref == 'refs/heads/deploy-prod' && secrets.POSTMARK_SERVER_TOKEN_PROD || secrets.POSTMARK_SERVER_TOKEN_DEV }}
          SEARCH_COST_PER_CALL_USD: ${{ vars.SEARCH_COST_PER_CALL_USD_PROD || vars.SEARCH_COST_PER_CALL_USD_DEV }}
          BRAVE_API_KEY: ${{ github.ref == 'refs/heads/deploy-prod' && secrets.BRAVE_API_KEY_PROD || secrets.BRAVE_API_KEY_DEV }}
          BRAVE_COST_PER_CALL_USD: ${{ vars.BRAVE_COST_PER_CALL_USD_PROD || vars.BRAVE_COST_PER_CALL_USD_DEV }}
          MAX_JOB_COST_USD: ${{ vars.MAX_JOB_COST_USD_PROD || vars.MAX_JOB_COST_USD_DEV }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS_PROD || '*' }}
        run: bash infra/deploy.sh
