# Build + deploy the public FloridaBizLab SPA (apps/fbizlab) to the PROD Firebase
# Hosting site. Dispatch for releases; a nightly schedule re-bakes the catalog.
#
# The pricing catalog is baked into the build (apps/fbizlab/scripts/fetch-plans.mjs)
# and read from the PROD API, so it carries prod's Stripe data — dev's build reads
# the dev API and therefore dev/sandbox Stripe. One schedule per environment.
#
# The scheduled run checks out `deploy-prod`, the released ref (the same branch the
# API's prod deploy uses), NOT the default branch. A cron on the default branch
# would quietly ship unreleased code to production every night. Until that branch
# exists the scheduled run skips itself cleanly instead of failing daily:
#   git push origin main:deploy-prod
#
# Every key/id/URL differs between dev and prod. This workflow reads FBIZLAB_PROD_*
# variables and the GCP_SA_KEY_PROD secret; it shares nothing with the dev workflow.
#
# ONE-TIME SETUP (prod):
#   firebase hosting:sites:create agent-researcher-prod-fbizlab --project sinuous-canto-497518-h7
#   gh variable set FBIZLAB_PROD_API_BASE_URL     --body "https://<prod-cloud-run-api-url>"
#   gh variable set FBIZLAB_PROD_GOOGLE_CLIENT_ID --body "<prod-oauth-client-id>.apps.googleusercontent.com"
#   # SA key with deploy rights on the prod hosting site (may equal the dev key if
#   # the prod site lives in the same GCP project):
#   gh secret set GCP_SA_KEY_PROD < prod-sa-key.json
#
name: Deploy fbizlab SPA (prod)

on:
  # A prod release re-bakes the catalog from PROD Stripe, same as dev does on main.
  push:
    branches: [deploy-prod]
    paths:
      # Its own code…
      - 'apps/fbizlab/**'
      # …and the backend, because the build bakes the Stripe catalog into the
      # bundle: a backend release is a good moment to refresh prices, and it costs
      # ~40s. Everything else (worker, admin, infra, docs) skips this workflow, so
      # the common push stays fast.
      - 'apps/api/**'
      - 'packages/core/**'
      - '.github/workflows/deploy-fbizlab-prod.yml'
  # Nightly re-bake from the released ref (07:20 UTC, after dev).
  schedule:
    - cron: '20 7 * * *'
  workflow_dispatch: {}

concurrency:
  group: deploy-fbizlab-prod
  cancel-in-progress: false

permissions:
  contents: read

env:
  GCP_PROJECT_ID: sinuous-canto-497518-h7

jobs:
  # Nothing deploys that has not passed the suite. Six workflows shipped straight
  # from `setup-gcloud` to `deploy.sh`, so every guard in the repo was advisory.
  verify:
    uses: ./.github/workflows/verify.yml

  deploy-fbizlab-prod:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      # A scheduled run must never publish the default branch. Skip cleanly when
      # the released ref doesn't exist yet, rather than red-Xing every night.
      - name: Resolve the ref to build
        id: ref
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "ref=${{ github.ref }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git ls-remote --exit-code --heads "https://github.com/${{ github.repository }}" deploy-prod >/dev/null 2>&1; then
            echo "ref=deploy-prod" >> "$GITHUB_OUTPUT"
          else
            echo "No deploy-prod branch yet — skipping the scheduled catalog re-bake."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.ref.outputs.skip != 'true'
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - uses: actions/setup-node@v4
        if: steps.ref.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.ref.outputs.skip != 'true'

      - name: Build fbizlab SPA (prod config)
        if: steps.ref.outputs.skip != 'true'
        env:
          VITE_API_BASE_URL: ${{ vars.FBIZLAB_PROD_API_BASE_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.FBIZLAB_PROD_GOOGLE_CLIENT_ID }}
          VITE_APP_ID: fbizlab
          # Public site key, per environment — no fallback on purpose: a build with no
          # key ships a site nobody can sign in to, and `vite.config.ts` refuses it.
          VITE_TURNSTILE_SITE_KEY: ${{ vars.FBIZLAB_PROD_TURNSTILE_SITE_KEY }}
          # Anonymous traffic counting (Firebase Analytics in cookieless consent
          # mode). PROD ONLY, and that is enforced HERE and nowhere else: the dev
          # workflow passes none of these, so a dev bundle has no measurement id and
          # `analytics.ts` initializes nothing. There is no flag to get wrong.
          #
          # Every value is public — Firebase web config ships in the bundle by design
          # and is not a secret; the Firestore and Storage rules are what protect
          # data. They are repo VARIABLES for that reason, like the Turnstile site
          # key and the OAuth client id above.
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.FBIZLAB_PROD_FIREBASE_MEASUREMENT_ID }}
          VITE_FIREBASE_API_KEY: ${{ vars.FBIZLAB_PROD_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.FBIZLAB_PROD_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.FBIZLAB_PROD_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.FBIZLAB_PROD_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_SENDER_ID: ${{ vars.FBIZLAB_PROD_FIREBASE_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.FBIZLAB_PROD_FIREBASE_APP_ID }}
        run: npm run build -w @agent-researcher/fbizlab

      - name: Authenticate to Google Cloud (prod service-account key)
        if: steps.ref.outputs.skip != 'true'
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          credentials_json: ${{ secrets.GCP_SA_KEY_PROD }}

      - name: Deploy to Firebase Hosting (prod site)
        if: steps.ref.outputs.skip != 'true'
        working-directory: apps/fbizlab
        run: npx --yes firebase-tools deploy --only hosting:fbizlab-prod --project "${GCP_PROJECT_ID}" --non-interactive
